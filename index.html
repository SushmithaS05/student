<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Management</title>
<style>
:root{--bg:#f4f1fb;--surface:#fff;--ink:#241b3a;--muted:#6f6788;--line:#e3dcf3;--accent:#6c3df4;--accent-ink:#fff;--danger:#e0334f}
@media (prefers-color-scheme:dark){:root{--bg:#171226;--surface:#221a38;--ink:#efeafc;--muted:#a89fc4;--line:#372c57;--accent:#9b7bff;--accent-ink:#150f26;--danger:#ff6b86}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 "Trebuchet MS",Verdana,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:34px 20px 70px;background:linear-gradient(120deg,#6c3df4,#e23fa8 55%,#ff8a3d);color:#fff}
.wrap{max-width:980px;margin:auto}
h1{margin:0;font-size:30px}
header p{margin:4px 0 0;opacity:.9}
main{max-width:980px;margin:-44px auto 0;padding:0 20px 40px;display:grid;gap:20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{border-radius:12px;padding:14px 16px;color:#fff;box-shadow:0 6px 16px rgba(60,30,120,.22)}
.stat b{display:block;font-size:24px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat span{font-size:13px;opacity:.92}
.s1{background:linear-gradient(135deg,#6c3df4,#9b7bff)}
.s2{background:linear-gradient(135deg,#00a6a6,#2fd6a0)}
.s3{background:linear-gradient(135deg,#ff7a45,#ffb347)}
.s4{background:linear-gradient(135deg,#e23fa8,#ff6b9d)}
form,.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:0 2px 10px rgba(80,50,150,.08)}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end;border-top:5px solid var(--accent)}
label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
input,select{font:inherit;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
button{font:inherit;padding:9px 16px;border:0;border-radius:8px;background:linear-gradient(120deg,#6c3df4,#e23fa8);color:#fff;cursor:pointer}
button:hover{filter:brightness(1.08)}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
button.del{background:transparent;color:var(--danger);border:1px solid var(--danger);padding:8px 12px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.tools input{flex:1;min-width:180px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--accent);font-size:13px;cursor:pointer}
tbody tr:hover{background:rgba(108,61,244,.07)}
td.actions{text-align:right}
.who{display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.chip{padding:2px 10px;border-radius:99px;font-size:12px;color:#fff}
.badge{padding:2px 10px;border-radius:8px;font-weight:700;font-size:13px}
.empty{color:var(--muted);padding:20px 0;text-align:center}
</style>
</head>
<body>
<header><div class="wrap"><h1>Student management</h1><p>Track students, courses and grades in one place.</p></div></header>
<main>
  <div class="stats">
    <div class="stat s1"><b id="sTotal">0</b><span>Students</span></div>
    <div class="stat s2"><b id="sAvg">–</b><span>Average grade</span></div>
    <div class="stat s3"><b id="sTop">–</b><span>Top student</span></div>
    <div class="stat s4"><b id="sPass">–</b><span>Pass rate (40+)</span></div>
  </div>

  <form id="form">
    <input type="hidden" id="editId">
    <label>Full name<input id="name" required></label>
    <label>Roll no.<input id="roll" required></label>
    <label>Email<input id="email" type="email"></label>
    <label>Course
      <select id="course"><option>Computer Science</option><option>Mathematics</option><option>Physics</option><option>Commerce</option><option>Arts</option></select>
    </label>
    <label>Year
      <select id="year"><option>1</option><option>2</option><option>3</option><option>4</option></select>
    </label>
    <label>Grade (0–100)<input id="grade" type="number" min="0" max="100" required></label>
    <div style="display:flex;gap:8px">
      <button type="submit" id="saveBtn">Add student</button>
      <button type="button" class="ghost" id="cancelBtn" hidden>Cancel</button>
    </div>
  </form>

  <section class="list">
    <div class="tools">
      <input id="search" type="search" placeholder="Search by name, roll no. or course">
      <select id="filterCourse"><option value="">All courses</option></select>
      <button class="ghost" id="exportBtn" type="button">Export CSV</button>
    </div>
    <div class="scroll">
      <table>
        <thead><tr>
          <th data-k="name">Name</th><th data-k="roll">Roll no.</th><th data-k="course">Course</th>
          <th data-k="year">Year</th><th data-k="grade">Grade</th><th>Result</th><th></th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="empty" id="empty" hidden>No students yet. Add one using the form above.</div>
  </section>
</main>

<script>
let students = [];
try { students = JSON.parse(localStorage.getItem("students") || "[]"); } catch (e) {}
if (!students.length) students = [
  {id:1,name:"Asha Reddy",roll:"CS101",email:"asha@example.com",course:"Computer Science",year:"2",grade:91},
  {id:2,name:"Ravi Kumar",roll:"MA204",email:"ravi@example.com",course:"Mathematics",year:"3",grade:78}
];

const $ = id => document.getElementById(id);
let sortKey = "name", sortDir = 1;

const PAL=["#6c3df4","#e23fa8","#ff7a45","#00a6a6","#2f80ed","#8e44ad","#d35400","#16a085"];
function color(t){let n=0;for(const c of String(t))n+=c.charCodeAt(0);return PAL[n%PAL.length];}
function initials(n){return esc(n.split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase());}
function badge(g){
  const [t,bg,fg]=g>=85?["A","#d9f7e8","#0a7a4b"]:g>=70?["B","#dbe8ff","#1f4fb3"]:g>=55?["C","#fff0d2","#a05a00"]:g>=40?["D","#ffe3d6","#b4441a"]:["Fail","#ffdce3","#b3122f"];
  return `<span class="badge" style="background:${bg};color:${fg}">${t}</span>`;
}
function save(){ try { localStorage.setItem("students", JSON.stringify(students)); } catch (e) {} }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function render(){
  const q = $("search").value.toLowerCase(), fc = $("filterCourse").value;
  const courses = [...new Set(students.map(s => s.course))];
  const cur = $("filterCourse").value;
  $("filterCourse").innerHTML = '<option value="">All courses</option>' + courses.map(c => `<option ${c===cur?"selected":""}>${esc(c)}</option>`).join("");

  const list = students
    .filter(s => (!fc || s.course === fc) && [s.name, s.roll, s.course].join(" ").toLowerCase().includes(q))
    .sort((a,b) => (a[sortKey] > b[sortKey] ? 1 : a[sortKey] < b[sortKey] ? -1 : 0) * sortDir);

  $("rows").innerHTML = list.map(s => `<tr>
    <td><div class="who"><div class="av" style="background:${color(s.name)}">${initials(s.name)}</div>${esc(s.name)}</div></td>
    <td>${esc(s.roll)}</td><td><span class="chip" style="background:${color(s.course)}">${esc(s.course)}</span></td><td>${esc(s.year)}</td>
    <td><b>${esc(s.grade)}</b></td><td>${badge(Number(s.grade))}</td>
    <td class="actions"><button class="ghost" onclick="edit(${s.id})">Edit</button> <button class="del" onclick="removeStudent(${s.id})">Delete</button></td>
  </tr>`).join("");
  $("empty").hidden = list.length > 0;

  $("sTotal").textContent = students.length;
  if (students.length){
    $("sAvg").textContent = (students.reduce((t,s)=>t+Number(s.grade),0)/students.length).toFixed(1);
    $("sTop").textContent = students.reduce((a,b)=>Number(b.grade)>Number(a.grade)?b:a).name;
    $("sPass").textContent = Math.round(students.filter(s=>Number(s.grade)>=40).length/students.length*100)+"%";
  } else { $("sAvg").textContent = "–"; $("sTop").textContent = "–"; $("sPass").textContent = "–"; }
}

$("form").addEventListener("submit", e => {
  e.preventDefault();
  const data = {name:$("name").value.trim(),roll:$("roll").value.trim(),email:$("email").value.trim(),
    course:$("course").value,year:$("year").value,grade:Number($("grade").value)};
  const id = Number($("editId").value);
  if (id) students = students.map(s => s.id === id ? {...s, ...data} : s);
  else students.push({id: Date.now(), ...data});
  save(); resetForm(); render();
});

function edit(id){
  const s = students.find(x => x.id === id); if (!s) return;
  $("editId").value = id; $("name").value = s.name; $("roll").value = s.roll; $("email").value = s.email;
  $("course").value = s.course; $("year").value = s.year; $("grade").value = s.grade;
  $("saveBtn").textContent = "Save changes"; $("cancelBtn").hidden = false;
  $("name").focus();
}
function resetForm(){
  $("form").reset(); $("editId").value = ""; $("saveBtn").textContent = "Add student"; $("cancelBtn").hidden = true;
}
function removeStudent(id){
  if (!confirm("Delete this student?")) return;
  students = students.filter(s => s.id !== id); save(); render();
}
$("cancelBtn").onclick = resetForm;
$("search").oninput = render;
$("filterCourse").onchange = render;
document.querySelectorAll("th[data-k]").forEach(th => th.onclick = () => {
  sortDir = sortKey === th.dataset.k ? -sortDir : 1; sortKey = th.dataset.k; render();
});
$("exportBtn").onclick = () => {
  const head = ["Name","Roll","Email","Course","Year","Grade"];
  const rows = students.map(s => [s.name,s.roll,s.email,s.course,s.year,s.grade].map(v => `"${String(v).replace(/"/g,'""')}"`).join(","));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([head.join(",") + "\n" + rows.join("\n")], {type:"text/csv"}));
  a.download = "students.csv"; a.click();
};
render();
</script>
</body>
</html>
